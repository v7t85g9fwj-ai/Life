<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Жизнь в рассрочку</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1c2530; --muted:#6b7a8c;
    --green:#1f9d55; --green-bg:#e7f6ee; --red:#d64545; --red-bg:#fdeaea;

  .muted{color:var(--muted);font-size:13px}
  .big{font-size:28px;font-weight:800;letter-spacing:-.6px}
  .num{font-variant-numeric:tabular-nums}
  .green{color:var(--green)} .red{color:var(--red)} .blue{color:var(--blue)}

  button.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}

  button.green{background:var(--green)}
  button.red{background:var(--red)}

  .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;z-index:20;padding-bottom:env(safe-area-inset-bottom)}

  .nav .item.on{color:var(--blue);font-weight:700}

  .toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#1c2530;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;opacity:0;transition:opacity .25s;max-width:90%;text-align:center}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chip{background:#f2f5f9;border-radius:14px;padding:12px}

  .event-hero{background:linear-gradient(135deg,#eaf1ff,#f4f6f8);border-radius:14px;padding:14px;margin-bottom:10px}
  .monthly-row{display:flex;justify-content:space-between;padding:4px 0}
  .monthly-row .v{font-variant-numeric:tabular-nums}
  .divider{height:1px;background:var(--line);margin:10px 0}
  .goal{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .goal .top{display:flex;justify-content:space-between;font-size:13px}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .center{text-align:center}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .status-bar{position:sticky;top:0;z-index:9;background:rgba(244,246,248,.96);backdrop-filter:blur(8px);padding:8px 14px 10px;border-bottom:1px solid var(--line);margin:-14px -14px 10px}

  .mini-stat .v{font-size:12px;font-weight:700;color:var(--ink)}

  .action-bar{position:fixed;left:0;right:0;bottom:64px;max-width:520px;margin:0 auto;padding:10px 14px;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:15;padding-bottom:calc(10px + env(safe-area-inset-bottom) / 2)}

  .mode-card{border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;cursor:pointer}
  .mode-card.on{border-color:var(--blue);background:var(--blue-bg)}

<script>
"use strict";
/* ================= ДЕНЬГИ ================= */
const T = 100;
const tng = v => Math.round(v * T);
const fmt = v => (v / T).toLocaleString('ru-RU', {maximumFractionDigits:0}) + ' ₸';
const fmt0 = v => Math.round(v / T).toLocaleString('ru-RU');
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndInt = (a,b)=>Math.floor(rnd(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => arr.map(v=>[v,Math.random()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);

/* ================= ФИНАНСЫ ================= */
const Fin = {
  annuity(P, yearlyPct, months){
    if (months <= 0) return 0;
    const r = yearlyPct/100/12;
    if (r === 0) return Math.round(P / months);
    const k = Math.pow(1+r, months);
    return Math.round(P * r * k / (k - 1));
  },
  monthInterest(P, yearlyPct){ return Math.round(P * (yearlyPct/100/12)); },
  applyPayment(balance, yearlyPct, payment){
    const interest = Math.min(this.monthInterest(balance, yearlyPct), payment);
    let principal = payment - interest;
    if (principal > balance){ principal = balance; }
    const paid = interest + principal;
    return { interest, principal, paid, newBalance: balance - principal };
  },
  prepay(loan, extra, strategy){
    extra = Math.min(extra, loan.balance);
    if (extra <= 0) return loan;
    const nb = loan.balance - extra;
    if (nb === 0){
      return {...loan, balance:0, monthsLeft:0, monthly:0, totalExtra: (loan.totalExtra||0)+extra};
    }
    if (strategy === 'term'){
      const r = loan.rate/100/12;
      let months = loan.monthsLeft;
      if (loan.monthly > this.monthInterest(nb, loan.rate)){
        months = Math.ceil(Math.log(loan.monthly/(loan.monthly - nb*r))/Math.log(1+r));
        if (!isFinite(months) || months <= 0) months = loan.monthsLeft;
        months = Math.min(months, loan.monthsLeft);
      }
      return {...loan, balance: nb, monthsLeft: months, totalExtra:(loan.totalExtra||0)+extra};
    } else {
      const monthly = this.annuity(nb, loan.rate, loan.monthsLeft);
      return {...loan, balance: nb, monthly, totalExtra:(loan.totalExtra||0)+extra};
    }
  },
  totalInterestForecast(balance, yearlyPct, monthsLeft, monthly){
    if (balance <= 0 || monthsLeft <= 0) return 0;
    let bal = balance, interest = 0, guard = 0;
    while (bal > 0 && guard++ < 2000){
      const i = Math.min(this.monthInterest(bal, yearlyPct), monthly);
      const p = Math.min(bal, monthly - i);
      interest += i;
      bal -= p;
      if (p <= 0) break;
    }
    return interest;
  }
};

/* ================= СОЗДАНИЕ ИГРЫ ================= */
function newState(opts){
  const {scenarioId, difficultyId, playerName, spouseName, spouseWorks, startSalary, mode} = opts;
  const sc = SCENARIOS[scenarioId];
  const diff = DIFFICULTY[difficultyId];
  const loan = sc.price - sc.down;
  const monthly = Fin.annuity(loan, sc.rate, sc.years*12);
  let spouse = null;
  if (spouseName){
    spouse = {
      name: spouseName,
      gender: Math.random()<.5?'f':'m',
      salary: spouseWorks ? tng(startSalary) : 0,
      works: spouseWorks
    };
  }
  return {
    v:3, mode: mode || 'life',
    scenario:scenarioId, difficulty:difficultyId,
    playerName: playerName || 'Игрок',
    year:2025, month:1, day:1,
    cash: sc.savings, savings: 0, deposit: 0,
    energy:80, stress:30, social:60, comfort:40,
    skills:{comm:1, anal:1, digital:1, mgmt:0, prof:1},
    job: {...CAREERS[0], salary: Math.round(sc.startSalary*diff.incomeMul)},
    jobTenure: 0,
    careerSearch: null,
    courses: [],
    credits:[{id:'mortgage', name:'Ипотека', balance:loan, rate:sc.rate, monthsLeft:sc.years*12, monthly, initialMonths:sc.years*12, initialAmount:loan, totalExtra:0}],
    realEstate:[{id:'apt', name:'Квартира', value:sc.price, comfort:40, rented:false}],
    installments: [],
    car: null,
    spouse, children: [], pets: 0,
    spouseHealth: 100, monthlyChildCost: 0,
    pregnant: false, pregnancyMonth: 0,
    tx: [], eventsHistory: [], activeEvent: null, monthClosed: false,
    flags:{}, totalInterestPaid:0, inflation: 0.006,
    livingCostBase: Math.round(sc.living * diff.expenseMul),
    marketSalaryIndex: 1.0,

    jobsBoard: [],
    firedStreak: 0,
    overdueMonths: 0,

/* ================= ЭКОНОМИЧЕСКИЙ ДВИЖОК ================= */
const E = {
  money(s, delta, reason, cat='Прочее'){
    s.cash += delta;
    s.tx.push({date:s.year*12+s.month, cat, reason, amount:delta});
    if (s.cash < 0) s.flags.overdraft = true;
  },
  energy(s, d){ s.energy = clamp(s.energy+d, 0, 100); },
  stress(s, d){ s.stress = clamp(s.stress+d, 0, 100); },
  social(s, d){ s.social = clamp(s.social+d, 0, 100); },
  comfort(s, d){ s.comfort = clamp(s.comfort+d, 0, 100); },
  takeCredit(s, amount, ratePct, months, name){
    const monthly = Fin.annuity(amount, ratePct, months);
    s.credits.push({id:uid(), name, balance:amount, rate:ratePct, monthsLeft:months, monthly, initialMonths:months, initialAmount:amount, totalExtra:0});
    E.money(s, amount, 'Получен кредит: '+name, 'Кредит');
  },
  payCreditMonthly(s, cr){
    if (cr.balance <= 0) return;
    const payment = Math.min(cr.monthly, cr.balance + Fin.monthInterest(cr.balance, cr.rate));
    const res = Fin.applyPayment(cr.balance, cr.rate, payment);
    cr.balance = res.newBalance;
    cr.monthsLeft = Math.max(0, cr.monthsLeft-1);
    E.money(s, -payment, 'Платёж: '+cr.name, 'Кредит');
    if (cr.balance <= 0){ cr.closed = true; toast('Кредит закрыт: '+cr.name); }
  }
};

/* ================= МЕСЯЧНЫЙ ЦИКЛ ================= */
function startNextMonth(s){
  s.monthClosed = false;
  s.month += 1;
  if (s.month > 12){ s.month = 1; s.year += 1; }
  s.day = 1;
  s.energy = clamp(s.energy+20, 0, 100);
  s.stress = clamp(s.stress-6, 0, 100);
  s.social = clamp(s.social-2, 0, 100);
  s.jobTenure = (s.jobTenure||0) + 1;
  s.livingCostBase = Math.round(s.livingCostBase * (1 + s.inflation));
  s.subjobsUsed = {};
  s.marketSalaryIndex = Math.min(2.5, s.marketSalaryIndex * 1.005);

  // Курсы
  s.courses = s.courses.map(c => ({...c, weeksLeft: c.weeksLeft-4}));
  s.courses.forEach(c=>{
    if (c.weeksLeft<=0){
      Object.entries(c.effect).forEach(([k,v])=>{ s.skills[k]=(s.skills[k]||0)+v; });
      toast('Курс завершён: '+c.name);
    }
  });
  s.courses = s.courses.filter(c=>c.weeksLeft>0);

  // Поиск работы
  if (s.careerSearch){
    s.careerSearch.waited = (s.careerSearch.waited||0)+1;
    if (s.careerSearch.waited >= (s.careerSearch.waitMonths||1)){
      const chance = 0.55 + 0.05*Object.values(s.skills).reduce((a,b)=>a+b,0);
      if (Math.random() < chance){
        toast('Приняли на вакансию: '+s.careerSearch.vacancy.name);
        s.pendingJobOffer = s.careerSearch.vacancy;
      } else toast('Отказ по вакансии');
      s.careerSearch = null;
    }
  }

  // Доход
  if (s.job){
    s.cash += s.job.salary;
    s.tx.push({date:s.year*12+s.month, cat:'Доход', reason:'Зарплата', amount:s.job.salary});
  }
  if (s.spouse && s.spouse.works){
    s.cash += s.spouse.salary;
    s.tx.push({date:s.year*12+s.month, cat:'Доход', reason:'Зарплата супруга', amount:s.spouse.salary});
  }

  // Рассрочки
  s.installments.forEach(inst=>{
    if (inst.monthsLeft > 0){
      s.cash -= inst.monthly;
      s.tx.push({date:s.year*12+s.month, cat:'Рассрочка', reason:inst.name, amount:-inst.monthly});
      inst.monthsLeft--;
      if (inst.monthsLeft === 0){ inst.closed = true; toast('Рассрочка закрыта: '+inst.name); }
    }
  });
  s.installments = s.installments.filter(i=>!i.closed);

  // Расходы
  const expenses = computeMonthlyExpenses(s);
  Object.values(expenses).forEach(e=>{
    if (e.amount > 0){
      s.cash -= e.amount;
      s.tx.push({date:s.year*12+s.month, cat:e.cat, reason:e.reason, amount:-e.amount});
    }
  });

  // Проценты
  if (s.deposit > 0){
    const interest = Math.round(s.deposit * 0.14 / 12);
    s.deposit += interest;
    s.tx.push({date:s.year*12+s.month, cat:'Банк', reason:'Проценты депозита', amount:interest});
  }
  if (s.savings > 0){
    s.savings += Math.round(s.savings * 0.12 / 12);
  }

  // Кредиты
  s.credits.forEach(cr=>E.payCreditMonthly(s, cr));
  s.credits = s.credits.filter(c=>c.balance>0);

  // Просрочка
  if (s.cash < 0){
    s.flags.overdraft = true;
    s.overdueMonths = (s.overdueMonths||0) + 1;
    const penalty = Math.round(Math.abs(s.cash) * 0.05);
    s.cash -= penalty;
    s.tx.push({date:s.year*12+s.month, cat:'Штраф', reason:'Пени за просрочку', amount:-penalty});
    s.stress = clamp(s.stress+15,0,100);
    if (s.overdueMonths >= 2){ toast('Просрочка! Банк может забрать имущество'); }
  } else {
    s.overdueMonths = 0;
  }

  // Увольнение за выгорание
  if (s.job && (s.stress > 85 || s.energy < 15)){
    s.firedStreak = (s.firedStreak||0) + 1;
    if (s.firedStreak >= 2){
      toast('Вас уволили из-за выгорания');
      s.job = null; s.firedStreak = 0;
      s.flags.fired = true;
    }
  } else s.firedStreak = 0;

  // Индексация зарплаты
  if (s.month === 1 && s.job){
    const idx = rnd(1.05, 1.10);
    s.job = {...s.job, salary: Math.round(s.job.salary*idx)};
  }
  if (s.month === 1 && s.spouse && s.spouse.works){
    s.spouse.salary = Math.round(s.spouse.salary * rnd(1.03,1.07));
  }

  // Беременность
  if (s.pregnant){
    s.pregnancyMonth = (s.pregnancyMonth||0) + 1;
    if (s.pregnancyMonth >= 9){
      s.pregnant = false; s.pregnancyMonth = 0;
      s.children.push({name:randName(Math.random()<.5?'m':'f'), birthYear:s.year});
      s.monthlyChildCost = (s.monthlyChildCost||0) + tng(60000);
      toast('Родился ребёнок!');
      s.achievements.push({name:'Рождение ребёнка', date:s.year+'/'+s.month});
    }
  }

  // Обновить вакансии
  refreshJobsBoard(s);

  // Случайное событие
  rollEvent(s);

  // Достижения
  checkAchievements(s);

  save(s);
}

function computeMonthlyExpenses(s){
  const base = s.livingCostBase;
  const childCost = (s.monthlyChildCost || 0);
  return {
    food:      {cat:'Бытовые', reason:'Продукты',  amount: Math.round(base*0.42) + Math.round(childCost*0.3)},
    utilities: {cat:'Бытовые', reason:'Коммунальные', amount: Math.round(base*0.22) + Math.round(childCost*0.15)},
    transport: {cat:'Бытовые', reason:'Транспорт', amount: Math.round(base*0.16)},
    internet:  {cat:'Бытовые', reason:'Связь', amount: Math.round(base*0.08)},
    misc:      {cat:'Бытовые', reason:'Прочие', amount: Math.round(base*0.12)},
    children:  childCost ? {cat:'Семья', reason:'Расходы на детей', amount: childCost} : {amount:0},
    car:       s.car ? {cat:'Транспорт', reason:'Содержание авто', amount: Math.round(s.car.maintenance)} : {amount:0},
  };
}

/* ================= ВАКАНСИИ ================= */
function refreshJobsBoard(s){
  const baseSalary = s.job ? s.job.salary : tng(450000);
  const marketMin = Math.round(baseSalary * 0.85 * s.marketSalaryIndex);
  const marketMax = Math.round(baseSalary * 1.35 * s.marketSalaryIndex);
  const list = [];
  if (s.flags.fired || s.overdueMonths >= 1){
    shuffle(LOW_JOBS).slice(0,4).forEach(cr=>{
      list.push({id:uid(), careerId:cr.id, name:cr.name, salary: Math.round(rndInt(marketMin*0.4, marketMax*0.55)), req:cr.req});
    });
  } else {
    shuffle(CAREERS).slice(0,5).forEach(cr=>{
      list.push({id:uid(), careerId:cr.id, name:cr.name, salary: rndInt(marketMin, marketMax), req:cr.req});
    });
    shuffle(LOW_JOBS).slice(0,1).forEach(cr=>{
      list.push({id:uid(), careerId:cr.id, name:cr.name, salary: rndInt(marketMin*0.4, marketMax*0.55), req:cr.req});
    });
  }
  s.jobsBoard = list;
}

/* ================= СОБЫТИЯ ================= */
function rollEvent(s){
  if (s.mode === 'story'){
    // В режиме истории — события истории
    if (Math.random() < 0.6){
      const ev = pick(STORY_EVENTS.filter(e=>e.id===s.story.stage));
      if (ev){
        const n = s.story.partnerName || randName('f');
        s.activeEvent = {id:ev.id, data:{title:ev.title, text:ev.text.replace('{name}', n), options: ev.options.map(o=>({label:o.label, effect: (st)=>{ o.effect({...st, story:{...st.story, partnerName:st.story.partnerName || n}}); }}))}};
        return;
      }
    }
    s.activeEvent = null; return;
  }
  if (Math.random() > 0.80 * DIFFICULTY[s.difficulty].eventRisk){ s.activeEvent = null; return; }
  const candidates = [];
  EVENT_TEMPLATES.forEach(t=>{
    if (t.cond && !t.cond(s)) return;
    const recent = s.eventsHistory.filter(e=>e.id===t.id && (s.year*12+s.month)-e.month < 4).length;
    if (recent >= 1) return;
    candidates.push(t);
  });
  if (!candidates.length){ s.activeEvent = null; return; }
  const totalW = candidates.reduce((a,c)=>a+(c.w||1),0);
  let r = Math.random()*totalW;
  let chosen = candidates[0];
  for (const c of candidates){ r -= (c.w||1); if (r <= 0){ chosen = c; break; } }
  s.activeEvent = {id:chosen.id, data: chosen.build(s)};
  s.eventsHistory.push({id:chosen.id, month: s.year*12+s.month});
}

function checkAchievements(s){
  const push = (name) => { if (!s.achievements.find(a=>a.name===name)) s.achievements.push({name, date:s.year+'/'+s.month}); };
  if (s.savings + s.deposit >= tng(1000000)) push('Первый миллион');
  if (s.children.length >= 1) push('Родитель');
  if (s.spouse) push('Семьянин');
  if (s.car) push('Автовладелец');
}

function renderGoalBar(s){
  const m = s.credits.find(c=>c.id==='mortgage');
  if (s.goal.id === 'mortgage' && m){
    const p = Math.round((1 - m.balance/m.initialAmount) * 100);
    return `<div class="muted">Осталось ${fmt(m.balance)}</div><div class="progress" style="margin-top:6px"><i style="width:${p}%"></i></div><div class="hint">${p}% погашено</div>`;
  }
  if (s.goal.id === 'savings'){
    const target = tng(5000000);
    const cur = s.savings + s.deposit;
    const p = clamp(cur/target*100,0,100);
    return `<div class="muted">Накоплено ${fmt(cur)} из ${fmt(target)}</div><div class="progress" style="margin-top:6px"><i style="width:${p}%"></i></div>`;
  }
  if (s.goal.id === 'car'){
    const target = tng(6000000);
    const cur = s.savings + s.deposit;
    const p = clamp(cur/target*100,0,100);
    return `<div class="muted">Автомобиль ${fmt(cur)} / ${fmt(target)}</div><div class="progress" style="margin-top:6px"><i style="width:${p}%"></i></div>`;
  }
  return `<div class="muted">Долгосрочная цель</div>`;
}

function drawDebtSpark(root){
  const svg = root.querySelector('[data-spark="debt"]'); if (!svg) return;
  const mort = S.credits.find(c=>c.id==='mortgage'); if (!mort) return;
  const points = []; let bal = mort.balance; const monthly = mort.monthly;
  for (let i=0;i<30;i++){
    const r = Fin.monthInterest(bal, mort.rate);
    const p = Math.min(bal, monthly-r); bal -= p; points.push(bal);
    if (bal <= 0) break;
  }
  const max = Math.max(...points, 1); const W = 300, H = 70;
  const stepX = W / Math.max(points.length-1,1);
  const path = points.map((v,i)=>`${i===0?'M':'L'} ${(i*stepX).toFixed(1)} ${(H - v/max*H + 1).toFixed(1)}`).join(' ');
  svg.innerHTML = `<path d="${path}" stroke="#2f6fed" stroke-width="2" fill="none"/>`;
}

function openPrepay(){
  const s = S;
  const mort = s.credits.find(c=>c.id==='mortgage'); if (!mort) return;
  const maxExtra = Math.min(s.cash, mort.balance);
  const modal = el(`<div></div>`);

      <select id="prepayStrategy"><option value="term">Сократить срок</option><option value="payment">Уменьшить платёж</option></select>
    </div>
    <button class="green" style="width:100%" onclick="doPrepay()">Внести</button>

function doPrepay(){
  const s = S;
  const mort = s.credits.find(c=>c.id==='mortgage'); if (!mort) return;
  const amt = Math.max(0, Math.min(mort.balance, tng(Number(document.getElementById('prepaySum').value)||0)));
  const strat = document.getElementById('prepayStrategy').value;
  if (amt <= 0 || amt > s.cash){ toast('Некорректно'); return; }
  s.cash -= amt;
  s.credits[s.credits.indexOf(mort)] = Fin.prepay(mort, amt, strat);
  s.tx.push({date:s.year*12+s.month, cat:'Кредит', reason:'Досрочка', amount:-amt});
  closeModal(); save(S); renderAll(); toast('Досрочка выполнена');
}

function openSchedule(){
  const s = S;
  const mort = s.credits.find(c=>c.id==='mortgage'); if (!mort) return;
  let bal = mort.balance; let rows = []; let totalInt = 0; let i = 0;
  while (bal > 0 && i < mort.monthsLeft+1){
    const interest = Fin.monthInterest(bal, mort.rate);
    const principal = Math.min(bal, mort.monthly - interest);
    bal -= principal; totalInt += interest;
    rows.push({i:i+1, interest, principal, bal});
    i++; if (principal <= 0) break;
  }
  const modal = el(`<div></div>`);
  modal.innerHTML = `
    <h2>График</h2>
    <div class="muted">Переплата: ${fmt(totalInt)}</div>
    <div style="max-height:300px;overflow:auto;margin-top:8px">
      <table style="border-collapse:collapse;width:100%;font-size:12px">
        <tr><th>№</th><th>%</th><th>Долг</th><th>Остаток</th></tr>
        ${rows.slice(0,60).map(r=>`<tr><td>${r.i}</td><td>${fmt0(r.interest)}</td><td>${fmt0(r.principal)}</td><td>${fmt0(r.bal)}</td></tr>`).join('')}
      </table>
    </div>
    <button class="ghost" style="width:100%;margin-top:10px" onclick="closeModal()">Закрыть</button>
  `;
  openModal(modal);
}

function openSubjobs(){
  const s = S;
  const modal = el(`<div></div>`);
  const available = SUBJOBS.filter(j=>{
    if (j.req.car && !s.car) return false;
    return Object.entries(j.req).every(([k,v])=>k==='car'?true:(s.skills[k]||0)>=v);
  });
  modal.innerHTML = `<h2>Подработки</h2><div class="muted">Энергия: ${s.energy}/100</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${available.map(j=>{
    const used = s.subjobsUsed[j.id]||0;
    const can = used < (j.limit||1) && s.energy >= 10;
    const range = `${fmt(j.pay[0])}–${fmt(j.pay[1])}`;
    return `<button ${!can?'class="gray" disabled':`onclick="doSubjob('${j.id}')"`}>${escape(j.name)} · ${range} · ${used}/${j.limit||1}</button>`;
  }).join('')}</div><button class="ghost" style="width:100%;margin-top:10px" onclick="closeModal()">Закрыть</button>`;
  openModal(modal);
}
function doSubjob(id){
  const s = S;
  const j = SUBJOBS.find(x=>x.id===id); if (!j) return;
  if (s.energy < 10){ toast('Устали'); return; }
  const used = s.subjobsUsed[j.id]||0;
  if (used >= (j.limit||1)){ toast('Лимит'); return; }
  let pay = rndInt(j.pay[0], j.pay[1]);
  if (j.id === 'taxi'){
    const day = s.day;
    const mul = day===5||day===6 ? rnd(1.2, 1.5) : rnd(0.9, 1.2);
    pay = Math.round(pay * mul);
  }
  E.money(s, pay, 'Подработка: '+j.name, 'Доход');
  E.energy(s, -j.fatigue);
  s.subjobsUsed[j.id] = used + 1;
  toast('+'+fmt(pay));
  closeModal(); save(S); renderAll();
}

function openCarCredit(idx){
  const cars = window._cars;
  const c = cars[idx];
  const modal = el(`<div></div>`);
  modal.innerHTML = `<h2>Автокредит</h2><div class="muted">${c.name} · ${fmt(c.price)}</div><div class="field" style="margin-top:10px"><label class="muted">Срок</label><select id="carTerm"><option value="12">12 мес (18%)</option><option value="24">24 мес (17%)</option><option value="36" selected>36 мес (15%)</option><option value="60">60 мес (16%)</option></select></div><div class="muted">Первый взнос 20%</div><button class="green" style="width:100%;margin-top:10px" onclick="doBuyCar(${idx},true,Number(document.getElementById('carTerm').value))">Оформить</button><button class="ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Отмена</button>`;
  openModal(modal);
}
function doBuyCar(idx, credit, term){
  const s = S;
  const c = window._cars[idx];
  if (!c) return;
  if (credit){
    const down = Math.round(c.price*0.2);
    if (s.cash < down){ toast('Нужно '+fmt(down)); return; }
    const rate = term===12?18:term===24?17:term===36?15:16;
    const loan = c.price - down;
    const monthly = Fin.annuity(loan, rate, term);
    s.cash -= down;
    s.credits.push({id:uid(), name:'Автокредит: '+c.name, balance:loan, rate, monthsLeft:term, monthly, initialMonths:term, initialAmount:loan, totalExtra:0});
    s.car = {name:c.name, value:c.price, maintenance:c.maint};
    s.tx.push({date:s.year*12+s.month, cat:'Имущество', reason:'Взнос за авто', amount:-down});
  } else {
    if (s.cash < c.price){ toast('Мало'); return; }
    s.cash -= c.price;
    s.car = {name:c.name, value:c.price, maintenance:c.maint};
    s.tx.push({date:s.year*12+s.month, cat:'Имущество', reason:'Покупка авто', amount:-c.price});
  }
  closeModal(); save(S); renderAll(); toast('Авто куплено');
}

function openInstallment(){
  const s = S;
  const modal = el(`<div></div>`);
  modal.innerHTML = `<h2>Рассрочка</h2><div class="muted">0% на срок, но фиксированный платёж каждый месяц.</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">${INSTALLMENTS.map((i,idx)=>`<button onclick="doInstallment(${idx})">${i.name} · ${fmt(i.price)} · ${i.months} мес.</button>`).join('')}</div><button class="ghost" style="width:100%;margin-top:10px" onclick="closeModal()">Закрыть</button>`;
  openModal(modal);
}
function doInstallment(idx){
  const s = S;
  const i = INSTALLMENTS[idx];
  const monthly = Math.round(i.price / i.months);
  s.installments.push({name:i.name, monthly, monthsLeft:i.months, total:i.price});
  s.comfort = clamp(s.comfort + i.comfort,0,100);
  s.realEstate[0].comfort = s.comfort;
  s.tx.push({date:s.year*12+s.month, cat:'Рассрочка', reason:'Оформлена рассрочка: '+i.name, amount:0});
  closeModal(); save(S); renderAll(); toast('Рассрочка оформлена');
}

/* ================= ИСТОРИЯ ================= */
function openHistory(){
  const s = S;
  const cutoff = (s.year*12+s.month) - 3;
  const list = s.tx.filter(t=>t.date >= cutoff);
  const modal = el(`<div></div>`);
  modal.innerHTML = `<h2>История за 3 месяца</h2><div style="max-height:400px;overflow:auto">${list.slice().reverse().map(tx=>`<div class="list-item"><div><div>${escape(tx.reason)}</div><div class="muted">${catName(tx.cat)}</div></div><div class="num ${tx.amount>=0?'green':'red'}">${tx.amount>=0?'+':''}${fmt(tx.amount)}</div></div>`).join('') || '<div class="muted">Пусто</div>'}</div><button class="ghost" style="width:100%;margin-top:10px" onclick="closeModal()">Закрыть</button>`;
  openModal(modal);
}

/* ================= ВСПОМОГАТЕЛЬНЫЕ ================= */
const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function monthName(m){ return MONTHS_RU[m-1] || ''; }
function skillName(k){ return {comm:'Коммуникация', anal:'Аналитика', digital:'Цифровые', mgmt:'Управление', prof:'Профессия'}[k]||k; }
function catName(c){ return {Доход:'Доход','Бытовые':'Бытовые','Кредит':'Кредит','Транспорт':'Транспорт','Обучение':'Обучение','Имущество':'Имущество','Банк':'Банк','Накопления':'Накопления','Развлечения':'Развлечения','Семья':'Семья','Медицина':'Медицина','Рассрочка':'Рассрочка','Штраф':'Штраф','Прочее':'Прочее'}[c]||c; }
function escape(str){ return String(str).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

/* ================= GLOBAL ================= */
Object.assign(window, {
  go, closeModal, openActiveEvent, chooseEventOption,
  openMonthClose, confirmMonth,
  openPrepay, doPrepay, openSchedule, openBank, doRefinance, openDeposit, doDeposit,
  openMoveToSavings, doMoveToSavings, openSubjobs, doSubjob,
  startCourse, applyJob, acceptOffer, declineOffer,
  lifeRest, lifeFriends, openVacation, doVacation, planChild,

  startNew, startRandom, continueGame, giftChoice, afterIntro, openHistory,

});

/* ================= INIT ================= */
(function init(){
  const existing = load();
  if (existing){ S = existing; if (!S.jobsBoard || !S.jobsBoard.length) refreshJobsBoard(S); }
  renderAll();
  setInterval(()=>{ if (S) save(S); }, 30000);
})();
</script>
