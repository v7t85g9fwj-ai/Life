<script>
"use strict";
/* ============================================================
   УТИЛИТЫ ДЕНЕГ: все суммы в ЦЕЛЫХ тиынах (1 ₸ = 100 тн)
   ============================================================ */
const T = 100;                    // тиынов в тенге
const tng = v => Math.round(v * T);          // тенге -> тиыны
const fmt = v => (v / T).toLocaleString('ru-RU', {maximumFractionDigits:0}) + ' ₸';
const fmt0 = v => Math.round(v / T).toLocaleString('ru-RU');

const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndInt = (a,b)=>Math.floor(rnd(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const uid = () => Math.random().toString(36).slice(2,10);

/* ============================================================
   ФИНАНСОВЫЙ ДВИЖОК (единственный источник истины)
   ============================================================ */
const Fin = {
  // A = P*r*(1+r)^n / ((1+r)^n - 1), r месячная, деньги в тиынах
  annuity(P, yearlyPct, months){
    if (months <= 0) return 0;
    const r = yearlyPct/100/12;
    if (r === 0) return Math.round(P / months);
    const k = Math.pow(1+r, months);
    return Math.round(P * r * k / (k - 1));
  },
  // Проценты за месяц
  monthInterest(P, yearlyPct){ return Math.round(P * (yearlyPct/100/12)); },

  // Применить платёж: возвращает {interest, principal, newBalance}
  applyPayment(balance, yearlyPct, payment){
    const interest = Math.min(this.monthInterest(balance, yearlyPct), payment);
    let principal = payment - interest;
    if (principal > balance){ principal = balance; }
    const paid = interest + principal;
    return { interest, principal, paid, newBalance: balance - principal };
  },

  // Досрочное погашение. strategy: 'term' (сократить срок) | 'payment' (уменьшить платёж)
  prepay(loan, extra, strategy){
    extra = Math.min(extra, loan.balance);
    if (extra <= 0) return loan;
    const nb = loan.balance - extra;
    const beforeMonthly = loan.monthly;
    const beforeMonths = loan.monthsLeft;
    const beforeTotalInterest = this.totalInterestForecast(nb===0?0:loan.balance, loan.rate, loan.monthsLeft, loan.monthly);

    if (nb === 0){
      return {...loan, balance:0, monthsLeft:0, monthly:0, totalExtra: (loan.totalExtra||0)+extra};
    }
    if (strategy === 'term'){
      // сохраняем платёж, пересчитываем срок
      const r = loan.rate/100/12;
      let months = loan.monthsLeft;
      if (loan.monthly > this.monthInterest(nb, loan.rate)){
        months = Math.ceil(Math.log(loan.monthly/(loan.monthly - nb*r))/Math.log(1+r));
        if (!isFinite(months) || months <= 0) months = loan.monthsLeft;
        months = Math.min(months, loan.monthsLeft);
      }
      return {...loan, balance: nb, monthsLeft: months, totalExtra:(loan.totalExtra||0)+extra};
    } else {
      // сохраняем срок, пересчитываем платёж
      const monthly = this.annuity(nb, loan.rate, loan.monthsLeft);
      return {...loan, balance: nb, monthly, totalExtra:(loan.totalExtra||0)+extra};
    }
  },

  // Прогноз суммы процентов до закрытия (по текущему платежу)
  totalInterestForecast(balance, yearlyPct, monthsLeft, monthly){
    if (balance <= 0 || monthsLeft <= 0) return 0;
    let bal = balance, interest = 0, guard = 0;
    while (bal > 0 && guard++ < 2000){
      const i = Math.min(this.monthInterest(bal, yearlyPct), monthly);
      const p = Math.min(bal, monthly - i);
      interest += i;
      bal -= p;
      if (p <= 0) break;
    }
    return interest;
  }
};

/* ============================================================

// Базовый список событий (>100 будет сгенерирован ниже через шаблоны)
const EVENT_TEMPLATES = [

    ]
  })},
  {id:'help_family', weight:6, cond:s=>s.month>=3, build:s=>({
    title:'Помощь родителям',
    text:'Родителям нужна помощь — мама попросила немного денег на лечение.',
    options:[
      {label:'Помочь (60 000 ₸)', effect:s=>{ E.money(s,-tng(60000),'Помощь родителям'); E.social(s,+8); }},
      {label:'Помочь частично (25 000 ₸)', effect:s=>{ E.money(s,-tng(25000),'Помощь родителям'); E.social(s,+3); }},
      {label:'Отказаться', effect:s=>{ E.social(s,-8); E.stress(s,+5); }},

  {id:'birthday', weight:7, build:s=>({

/* ============================================================
   ДВИЖОК ЭКОНОМИКИ: изменения состояния
   ============================================================ */
const E = {
  money(s, delta, reason, cat='Прочее'){
    s.cash += delta;
    s.tx.push({date:s.year*12+s.month, cat, reason, amount:delta});
    if (s.cash < 0){
      // автоматически уходим в минус — это просрочка, штраф
      s.flags.overdraft = true;
    }
  },
  energy(s, d){ s.energy = clamp(s.energy+d, 0, 100); },
  stress(s, d){ s.stress = clamp(s.stress+d, 0, 100); },
  social(s, d){ s.social = clamp(s.social+d, 0, 100); },
  comfort(s, d){ s.comfort = clamp(s.comfort+d, 0, 100); },

  takeCredit(s, amount, ratePct, months, name){
    const monthly = Fin.annuity(amount, ratePct, months);
    s.credits.push({id:uid(), name, balance:amount, rate:ratePct, monthsLeft:months, monthly, initialMonths:months, initialAmount:amount, totalExtra:0});
    E.money(s, amount, 'Получен кредит: '+name, 'Кредит');
  },

  // Ежемесячный платёж по кредиту (защита от повторного списания)
  payCreditMonthly(s, cr){
    if (cr.balance <= 0) return;
    const payment = Math.min(cr.monthly, cr.balance + Fin.monthInterest(cr.balance, cr.rate));
    const res = Fin.applyPayment(cr.balance, cr.rate, payment);
    cr.balance = res.newBalance;
    cr.monthsLeft = Math.max(0, cr.monthsLeft-1);
    E.money(s, -payment, 'Платёж по кредиту: '+cr.name, 'Кредит');
    if (cr.balance <= 0){ cr.closed = true; toast('Кредит закрыт: '+cr.name); }
  }
};

/* ============================================================
   СЦЕНАРИИ СТАРТА
   ============================================================ */
const SCENARIOS = {
  normal: {name:'Обычная квартира', price:tng(25000000), down:tng(5000000), years:20, rate:18, startSalary:tng(450000), savings:tng(150000), living:tng(175000)},

const DIFFICULTY = {

/* ============================================================
   СОЗДАНИЕ НОВОЙ ИГРЫ
   ============================================================ */
function newState(scenarioId, difficultyId){
  const sc = SCENARIOS[scenarioId];
  const diff = DIFFICULTY[difficultyId];
  const loan = sc.price - sc.down;
  const monthly = Fin.annuity(loan, sc.rate, sc.years*12);
  return {
    v:1,
    scenario:scenarioId, difficulty:difficultyId,
    year:2025, month:1, day:1,
    cash: sc.savings,
    savings: 0, // накопительный счёт
    deposit: 0,
    energy:80, stress:30, social:60, comfort:40,
    skills:{comm:1, anal:1, digital:1, mgmt:0, prof:1},
    job: CAREERS[0] ? {...CAREERS[0], salary: Math.round(sc.startSalary*diff.incomeMul)} : null,
    jobTenure: 0,
    careerSearch: null,   // {vacancy, sent, wait}
    courses: [],          // активные курсы
    credits:[{id:'mortgage', name:'Ипотека', balance:loan, rate:sc.rate, monthsLeft:sc.years*12, monthly, initialMonths:sc.years*12, initialAmount:loan, totalExtra:0}],
    realEstate:[{id:'apt', name:'Квартира', value:sc.price, comfort:40, rented:false}],
    car: null,
    tx:[],
    eventsHistory:[],
    log:[],
    activeEvent:null,
    monthClosed:false,
    flags:{},
    firstMonthIntro:false,
    totalInterestPaid:0,
    startMonth: 2025*12+1,
    inflation: 0.006,  // месячная инфляция
    livingCostBase: Math.round(sc.living * diff.expenseMul),
    goals:[
      {id:'emergency', name:'Подушка на 3 месяца расходов', target: null, current:0},
      {id:'downpayment', name:'Первый взнос на вторую недвижимость', target:tng(5000000), current:0},
    ],
    achievements:[]
  };
}

/* ============================================================
   СИСТЕМА МЕСЯЦА: начисление зарплаты, списание расходов
   ============================================================ */
function startNextMonth(s){
  s.monthClosed = false;
  s.month += 1;
  if (s.month > 12){ s.month = 1; s.year += 1; }
  s.day = 1;
  s.energy = clamp(s.energy+15, 0, 100);
  s.stress = clamp(s.stress-5, 0, 100);
  s.social = clamp(s.social-2, 0, 100);
  s.jobTenure = (s.jobTenure||0) + 1;
  // инфляция
  s.livingCostBase = Math.round(s.livingCostBase * (1 + s.inflation));
  // прогресс курсов
  s.courses = s.courses.map(c => ({...c, weeksLeft: c.weeksLeft-4}));
  s.courses.forEach(c=>{ if (c.weeksLeft<=0){ Object.entries(c.effect).forEach(([k,v])=>{ s.skills[k]=(s.skills[k]||0)+v; }); toast('Курс завершён: '+c.name); }});
  s.courses = s.courses.filter(c=>c.weeksLeft>0);
  // поиск работы
  if (s.careerSearch){
    s.careerSearch.waited = (s.careerSearch.waited||0)+1;
    if (s.careerSearch.waited >= 2){
      // решение по вакансии
      const chance = 0.55 + 0.05*Object.values(s.skills).reduce((a,b)=>a+b,0);
      if (Math.random() < chance){
        toast('Вас приглашают на позицию: '+s.careerSearch.vacancy.name);
        s.pendingJobOffer = s.careerSearch.vacancy;
      } else {
        toast('Отказ по вакансии: '+s.careerSearch.vacancy.name);
      }
      s.careerSearch = null;
    }
  }
  // зарплата
  if (s.job){
    s.cash += s.job.salary;
    s.tx.push({date:s.year*12+s.month, cat:'Доход', reason:'Зарплата', amount:s.job.salary});
  }
  // расходы
  const expenses = computeMonthlyExpenses(s);
  Object.values(expenses).forEach(e=>{
    if (e.amount > 0){
      s.cash -= e.amount;
      s.tx.push({date:s.year*12+s.month, cat:e.cat, reason:e.reason, amount:-e.amount});
    }
  });
  // кредиты
  s.credits.forEach(cr=>E.payCreditMonthly(s, cr));
  s.credits = s.credits.filter(c=>c.balance>0);
  // проверка на минус
  if (s.cash < 0){ s.flags.overdraft = true; s.stress = clamp(s.stress+10,0,100); }
  // генерация события
  rollEvent(s);
  // автосохранение
  save(s);
}

function computeMonthlyExpenses(s){
  const diff = DIFFICULTY[s.difficulty];
  const base = s.livingCostBase;
  return {
    food:      {cat:'Бытовые', reason:'Продукты',  amount: Math.round(base*0.42)},
    utilities: {cat:'Бытовые', reason:'Коммунальные', amount: Math.round(base*0.22)},
    transport: {cat:'Бытовые', reason:'Транспорт', amount: Math.round(base*0.16)},
    internet:  {cat:'Бытовые', reason:'Связь и интернет', amount: Math.round(base*0.08)},
    misc:      {cat:'Бытовые', reason:'Прочие расходы', amount: Math.round(base*0.12)},
    car:       s.car ? {cat:'Транспорт', reason:'Содержание авто', amount: Math.round(s.car.maintenance)} : {amount:0},
  };
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
function rollEvent(s){
  // Не более одного крупного события в месяц, вероятность зависит от сложности
  if (Math.random() > 0.75 * DIFFICULTY[s.difficulty].eventRisk){ s.activeEvent = null; return; }
  const candidates = [];
  EVENT_TEMPLATES.forEach(t=>{
    if (t.cond && !t.cond(s)) return;
    // ограничение повторов
    const recent = s.eventsHistory.filter(e=>e.id===t.id && (s.year*12+s.month)-e.month < 4).length;
    if (recent >= 1) return;
    candidates.push(t);
  });
  if (!candidates.length){ s.activeEvent = null; return; }
  const totalW = candidates.reduce((a,c)=>a+(c.weight||1),0);
  let r = Math.random()*totalW;
  let chosen = candidates[0];
  for (const c of candidates){ r -= (c.weight||1); if (r <= 0){ chosen = c; break; } }
  s.activeEvent = {id:chosen.id, data: chosen.build(s)};
  s.eventsHistory.push({id:chosen.id, month: s.year*12+s.month});
}

function el(html){ const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2200);
}

  document.getElementById('modal').innerHTML = '';

function renderNav(){
  const items = [

function drawDebtSpark(root){
  const svg = root.querySelector('[data-spark="debt"]'); if (!svg) return;
  const mort = S.credits.find(c=>c.name==='Ипотека'||c.id==='mortgage');
  if (!mort) return;
  const steps = 30;
  const points = [];
  let bal = mort.initialAmount;
  const monthly = mort.monthly;
  for (let i=0;i<steps;i++){
    const r = Fin.monthInterest(bal, mort.rate);
    const p = Math.min(bal, monthly-r);
    bal -= p;
    points.push(bal);
    if (bal <= 0) break;
  }
  const max = Math.max(...points, 1);
  const W = 300, H = 70;
  const stepX = W / Math.max(points.length-1,1);
  const path = points.map((v,i)=>`${i===0?'M':'L'} ${(i*stepX).toFixed(1)} ${(H - v/max*H + 1).toFixed(1)}`).join(' ');
  svg.innerHTML = `<path d="${path}" stroke="#2f6fed" stroke-width="2" fill="none"/>`;
}

   ============================================================ */
function renderFooter(){
  if (!S) return null;
  if (currentScreen === 'home' || currentScreen === 'finance'){
    const closed = S.monthClosed;
    const f = el(`<div style="margin-top:4px"></div>`);
    f.innerHTML = `
      <div class="card">
        <div class="row"><h3>Течение времени</h3><span class="muted">${monthName(S.month)} ${S.year}</span></div>
        <div class="btn-row" style="margin-top:8px">
          <button class="ghost" onclick="advanceDay()">Следующий день</button>
          <button class="ghost" onclick="advanceWeek()">Завершить неделю</button>
          <button class="green" ${closed?'disabled':''} onclick="openMonthClose()">Перейти к следующему месяцу</button>
        </div>
        <div class="hint">Прогноз: доход ${fmt(S.job?S.job.salary:0)}, обязательные расходы будут списаны автоматически. Перед закрытием месяца вы увидите отчёт.</div>
      </div>
    `;
    return f;
  }
  return null;
}

function startNew(){
  const sc = document.getElementById('scenarioSel').value;
  const df = document.getElementById('diffSel').value;
  S = newState(sc, df);
  save(S);
  showMortgageIntro();
}

function continueGame(){
  const s = load(); if (!s) return;
  S = migrate(s);
  currentScreen = 'home';
  renderAll();
}

function migrate(s){
  // на будущее: добавление недостающих полей
  if (!s.achievements) s.achievements = [];
  if (!s.credits) s.credits = [];
  return s;
}

function showMortgageIntro(){
  const s = S;
  const m = s.credits[0];
  const totalInterest = Fin.totalInterestForecast(m.balance, m.rate, m.monthsLeft, m.monthly);
  const modal = el(`<div></div>`);
  modal.innerHTML = `
    <h2>Ваша ипотека</h2>
    <div class="muted">${escape(SCENARIOS[s.scenario].name)}</div>
    <div class="divider"></div>
    <div class="kv"><span>Стоимость квартиры</span><span class="num">${fmt(SCENARIOS[s.scenario].price)}</span></div>
    <div class="kv"><span>Первоначальный взнос</span><span class="num">${fmt(SCENARIOS[s.scenario].down)}</span></div>
    <div class="kv"><span>Сумма кредита</span><span class="num">${fmt(m.initialAmount)}</span></div>
    <div class="kv"><span>Ставка</span><span class="num">${m.rate}%</span></div>
    <div class="kv"><span>Срок</span><span class="num">${m.initialMonths/12} лет</span></div>
    <div class="kv"><span>Ежемесячный платёж</span><span class="num">${fmt(m.monthly)}</span></div>
    <div class="kv"><span>Прогноз переплаты</span><span class="num">${fmt(totalInterest)}</span></div>
    <div class="btn-row" style="margin-top:12px"><button class="green" onclick="closeModal(); afterIntro()">Начать новую жизнь</button></div>
  `;
  openModal(modal);
}

function afterIntro(){
  // родственники дарят деньги
  const gift = tng(200000);
  S.cash += gift;
  S.tx.push({date:S.year*12+S.month, cat:'Доход', reason:'Подарок от родственников', amount:gift});
  save(S);
  renderAll();
  const modal = el(`<div></div>`);
  modal.innerHTML = `
    <h2>Подарок на новоселье</h2>
    <div class="muted">Родственники подарили вам ${fmt(gift)}. Что с ними сделать?</div>
    <div class="btn-row" style="margin-top:12px;flex-direction:column">
      <button onclick="giftChoice('prepay')">Внести в досрочное погашение</button>
      <button class="gray" onclick="giftChoice('repair')">Сделать ремонт (80 000 ₸), остальное оставить</button>
      <button class="gray" onclick="giftChoice('furniture')">Купить мебель (100 000 ₸), остальное оставить</button>
      <button class="ghost" onclick="giftChoice('save')">Оставить на накопительном счёте</button>
    </div>
  `;
  openModal(modal);
}

function giftChoice(kind){
  const s = S;
  const mort = s.credits[0];
  if (kind === 'prepay'){
    const extra = Math.min(tng(200000), mort.balance);
    s.cash -= extra;
    const nLoan = Fin.prepay(mort, extra, 'term');
    s.credits[0] = nLoan;
    s.tx.push({date:s.year*12+s.month, cat:'Кредит', reason:'Досрочное погашение', amount:-extra});
    toast('Досрочно погашено '+fmt(extra));
  } else if (kind === 'repair'){
    if (s.cash >= tng(80000)){
      s.cash -= tng(80000);
      s.comfort = clamp(s.comfort+15,0,100);
      s.tx.push({date:s.year*12+s.month, cat:'Имущество', reason:'Ремонт', amount:-tng(80000)});
      toast('Комфорт повышен');
    }
  } else if (kind === 'furniture'){
    if (s.cash >= tng(100000)){
      s.cash -= tng(100000);
      s.comfort = clamp(s.comfort+10,0,100);
      s.tx.push({date:s.year*12+s.month, cat:'Имущество', reason:'Мебель', amount:-tng(100000)});
      toast('Мебель куплена');
    }
  } else if (kind === 'save'){
    s.savings += tng(200000); s.cash -= tng(200000);
    s.tx.push({date:s.year*12+s.month, cat:'Накопления', reason:'Перевод на накопления', amount:-tng(200000)});
    toast('Средства на накоплениях');
  }
  save(S);
  closeModal();
  renderAll();
}

/* ============================================================
   ВРЕМЯ
   ============================================================ */
function advanceDay(){
  if (!S) return;
  S.day = S.day + 1;
  if (S.day > 7){
    // простая логика: до 7 дней в неделе, месяц закрывается вручную
    S.day = 1;
    toast('Прошла неделя');
  }
  save(S);
  renderAll();
}
function advanceWeek(){
  if (!S) return;
  S.day = Math.min(7, S.day+7);
  toast('Прошла неделя');
  save(S); renderAll();
}

function openMonthClose(){
  if (!S || S.monthClosed) return;
  const s = S;
  const expenses = computeMonthlyExpenses(s);
  const totalExp = Object.values(expenses).reduce((a,e)=>a+e.amount,0);
  const mort = s.credits.find(c=>c.id==='mortgage');
  const mortPay = mort?mort.monthly:0;
  const income = s.job?s.job.salary:0;
  const flow = income - totalExp - mortPay;
  const modal = el(`<div></div>`);
  modal.innerHTML = `
    <h2>Закрытие месяца</h2>
    <div class="muted">${monthName(s.month)} ${s.year}</div>
    <div class="divider"></div>
    <div class="monthly-row"><span>Зарплата</span><span class="v green">+${fmt(income)}</span></div>
    <div class="monthly-row"><span>Продукты</span><span class="v red">−${fmt(expenses.food.amount)}</span></div>
    <div class="monthly-row"><span>Коммунальные</span><span class="v red">−${fmt(expenses.utilities.amount)}</span></div>
    <div class="monthly-row"><span>Транспорт</span><span class="v red">−${fmt(expenses.transport.amount)}</span></div>
    <div class="monthly-row"><span>Связь и интернет</span><span class="v red">−${fmt(expenses.internet.amount)}</span></div>
    <div class="monthly-row"><span>Прочие</span><span class="v red">−${fmt(expenses.misc.amount)}</span></div>
    ${mort?`<div class="monthly-row"><span>Ипотека</span><span class="v red">−${fmt(mortPay)}</span></div>`:''}
    <div class="divider"></div>
    <div class="monthly-row"><b>Итог месяца</b><span class="v ${flow>=0?'green':'red'}"><b>${flow>=0?'+':'−'}${fmt(Math.abs(flow))}</b></span></div>
    <div class="divider"></div>
    <button class="green" style="width:100%" onclick="confirmMonth()">Подтвердить и перейти к следующему месяцу</button>
    <button class="ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Отмена</button>
  `;
  openModal(modal);
}

function confirmMonth(){
  if (!S || S.monthClosed) return;
  S.monthClosed = true;
  save(S);
  closeModal();
  startNextMonth(S);
  renderAll();
  // если событие — показать его
  if (S.activeEvent){
    setTimeout(()=>openActiveEvent(), 200);
  }
}

function openActiveEvent(){

/* ============================================================
   ДОСРОЧНОЕ ПОГАШЕНИЕ
   ============================================================ */
function openPrepay(){
  const s = S;
  const mort = s.credits.find(c=>c.id==='mortgage' || c.name==='Ипотека');
  if (!mort) return;
  const maxExtra = Math.min(s.cash, mort.balance);
  const beforeInterest = Fin.totalInterestForecast(mort.balance, mort.rate, mort.monthsLeft, mort.monthly);
  const modal = el(`<div></div>`);
  modal.innerHTML = `
    <h2>Досрочное погашение</h2>
    <div class="muted">Доступно: ${fmt(s.cash)}. Остаток долга: ${fmt(mort.balance)}.</div>
    <div class="field" style="margin-top:10px">
      <label class="muted">Сумма (в тенге)</label>
      <input type="number" id="prepaySum" value="${Math.round(maxExtra/T)}" min="0" max="${Math.round(mort.balance/T)}"/>
    </div>
    <div class="field">
      <label class="muted">Стратегия</label>
      <select id="prepayStrategy">
        <option value="term">Сократить срок (платёж прежний)</option>
        <option value="payment">Уменьшить платёж (срок прежний)</option>
      </select>
    </div>
    <div id="prepayPreview" class="card" style="box-shadow:none;background:#f7f9fb"></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="green" onclick="doPrepay()">Внести</button>
      <button class="ghost" onclick="closeModal()">Отмена</button>
    </div>
  `;
  openModal(modal);
  const input = modal.querySelector('#prepaySum');
  const sel = modal.querySelector('#prepayStrategy');
  const preview = modal.querySelector('#prepayPreview');
  function update(){
    const amt = Math.max(0, Math.min(mort.balance, tng(Number(input.value)||0)));
    const after = Fin.prepay({...mort}, amt, sel.value);
    const newInterest = Fin.totalInterestForecast(after.balance, after.rate, after.monthsLeft, after.monthly);
    preview.innerHTML = `
      <div class="kv"><span>Сумма к внесению</span><span class="num">${fmt(amt)}</span></div>
      <div class="kv"><span>Платёж: было / станет</span><span class="num">${fmt(mort.monthly)} → ${fmt(after.monthly)}</span></div>
      <div class="kv"><span>Срок: было / станет</span><span class="num">${mort.monthsLeft} → ${after.monthsLeft} мес.</span></div>
      <div class="kv"><span>Прогноз процентов</span><span class="num">${fmt(beforeInterest)} → ${fmt(newInterest)}</span></div>
      <div class="kv"><span>Экономия на процентах</span><span class="num green">${fmt(beforeInterest-newInterest)}</span></div>
    `;
  }
  input.oninput = update; sel.onchange = update; update();
}

function doPrepay(){
  const s = S;
  const mort = s.credits.find(c=>c.id==='mortgage' || c.name==='Ипотека');
  if (!mort) return;
  const input = document.getElementById('prepaySum');
  const sel = document.getElementById('prepayStrategy');
  const amt = Math.max(0, Math.min(mort.balance, tng(Number(input.value)||0)));
  if (amt <= 0){ toast('Некорректная сумма'); return; }
  if (amt > s.cash){ toast('Недостаточно средств'); return; }
  s.cash -= amt;
  const after = Fin.prepay(mort, amt, sel.value);
  const idx = s.credits.indexOf(mort);
  s.credits[idx] = after;
  s.tx.push({date:s.year*12+s.month, cat:'Кредит', reason:'Досрочное погашение', amount:-amt});
  closeModal();
  save(S);
  renderAll();
  toast('Досрочное погашение выполнено');
}

/* ============================================================
   ГРАФИК ПЛАТЕЖЕЙ
   ============================================================ */
function openSchedule(){
  const s = S;
  const mort = s.credits.find(c=>c.id==='mortgage' || c.name==='Ипотека');
  if (!mort) return;
  let bal = mort.balance; let rows = []; let totalInt = 0; let i = 0;
  while (bal > 0 && i < mort.monthsLeft+1){
    const interest = Fin.monthInterest(bal, mort.rate);
    const principal = Math.min(bal, mort.monthly - interest);
    bal -= principal; totalInt += interest;
    rows.push({i:i+1, interest, principal, bal});
    i++;
    if (principal <= 0) break;
  }
  const modal = el(`<div></div>`);
  modal.innerHTML = `
    <h2>График платежей</h2>
    <div class="muted">Переплата по текущим условиям: ${fmt(totalInt)}</div>
    <div class="scroll-x" style="max-height:300px;overflow:auto;margin-top:8px">
      <table class="mini">
        <tr><th>№</th><th>Проценты</th><th>Долг</th><th>Остаток</th></tr>
        ${rows.slice(0,60).map(r=>`<tr><td>${r.i}</td><td>${fmt0(r.interest)}</td><td>${fmt0(r.principal)}</td><td>${fmt0(r.bal)}</td></tr>`).join('')}
        ${rows.length>60?`<tr><td colspan="4" class="muted center">… ещё ${rows.length-60} платежей</td></tr>`:''}
      </table>
    </div>
    <div class="btn-row" style="margin-top:10px"><button class="ghost" onclick="closeModal()">Закрыть</button></div>
  `;
  openModal(modal);
}

/* ============================================================
   БАНК: рефинансирование и кредиты
   ============================================================ */
function openBank(){
  const s = S;
  const mort = s.credits.find(c=>c.id==='mortgage' || c.name==='Ипотека');
  const modal = el(`<div></div>`);
  let refinanceBlock = '<div class="muted">Пока нет доступных предложений.</div>';
  if (mort && (s.jobTenure>=3)){
    const newRate = Math.max(mort.rate-2.5, 12);
    const newMonthly = Fin.annuity(mort.balance, newRate, mort.monthsLeft);
    const oldInterest = Fin.totalInterestForecast(mort.balance, mort.rate, mort.monthsLeft, mort.monthly);
    const newInterest = Fin.totalInterestForecast(mort.balance, newRate, mort.monthsLeft, newMonthly);
    const fee = tng(150000);
    refinanceBlock = `
      <div class="card" style="box-shadow:none;background:#f7f9fb">
        <div class="muted">Банк подготовил предложение по пересмотру условий.</div>
        <div class="kv"><span>Ставка</span><span class="num">${mort.rate}% → ${newRate}%</span></div>
        <div class="kv"><span>Платёж</span><span class="num">${fmt(mort.monthly)} → ${fmt(newMonthly)}</span></div>
        <div class="kv"><span>Прогноз процентов</span><span class="num">${fmt(oldInterest)} → ${fmt(newInterest)}</span></div>
        <div class="kv"><span>Комиссия за оформление</span><span class="num">${fmt(fee)}</span></div>
        <div class="btn-row" style="margin-top:8px">
          <button onclick="doRefinance(${newRate}, ${newMonthly}, ${fee})">Рефинансировать</button>
        </div>
      </div>
    `;
  }
  modal.innerHTML = `
    <h2>Банк</h2>
    <div class="divider"></div>
    <h3>Рефинансирование</h3>
    ${refinanceBlock}
    <div class="divider"></div>
    <h3>Депозит</h3>
    <div class="muted">Открыть срочный депозит под 14% годовых на 6 месяцев.</div>
    <div class="btn-row" style="margin-top:8px">
      <button class="ghost" onclick="openDeposit()">Открыть депозит</button>
    </div>
    <div class="btn-row" style="margin-top:12px"><button class="gray" onclick="closeModal()">Закрыть</button></div>
  `;
  openModal(modal);
}

function doRefinance(newRate, newMonthly, fee){
  const s = S;
  if (s.cash < fee){ toast('Недостаточно средств на комиссию'); return; }
  const mort = s.credits.find(c=>c.id==='mortgage' || c.name==='Ипотека');
  if (!mort) return;
  mort.rate = newRate;
  mort.monthly = newMonthly;
  s.cash -= fee;
  s.tx.push({date:s.year*12+s.month, cat:'Банк', reason:'Комиссия за рефинансирование', amount:-fee});
  save(S); closeModal(); renderAll();
  toast('Рефинансирование оформлено');
}

function openDeposit(){
  const s = S;
  const modal = el(`<div></div>`);
  modal.innerHTML = `
    <h2>Депозит</h2>
    <div class="muted">Введите сумму (в тенге). Ставка 14% годовых.</div>
    <div class="field"><input type="number" id="depSum" value="${Math.round(Math.min(s.savings, tng(500000))/T)}"/></div>
    <div class="btn-row">
      <button class="green" onclick="doDeposit()">Открыть</button>
      <button class="ghost" onclick="closeModal()">Отмена</button>
    </div>
  `;
  openModal(modal);
}

function doDeposit(){
  const s = S;
  const amt = Math.max(0, tng(Number(document.getElementById('depSum').value)||0));
  if (amt <= 0 || amt > s.savings){ toast('Недостаточно на накоплениях'); return; }
  s.savings -= amt;
  s.deposit += amt;
  s.tx.push({date:s.year*12+s.month, cat:'Банк', reason:'Открыт депозит', amount:-amt});
  closeModal(); save(S); renderAll(); toast('Депозит открыт');
}

/* ============================================================
   ПОДРАБОТКИ
   ============================================================ */
function openSubjobs(){
  const s = S;
  const modal = el(`<div></div>`);
  const list = SUBJOBS.filter(j=>Object.entries(j.req).every(([k,v])=>(s.skills[k]||0)>=v));
  modal.innerHTML = `
    <h2>Подработки</h2>
    <div class="muted">Энергия: ${s.energy}/100</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      ${list.map(j=>`<button onclick="doSubjob('${j.id}')">${escape(j.name)} — ${fmt(j.pay)}</button>`).join('')}
    </div>
    <button class="ghost" style="width:100%;margin-top:12px" onclick="closeModal()">Закрыть</button>
  `;
  openModal(modal);
}

function doSubjob(id){
  const s = S;
  const j = SUBJOBS.find(x=>x.id===id);
  if (!j) return;
  if (s.energy < 10){ toast('Слишком устали'); return; }
  E.money(s, j.pay, 'Подработка: '+j.name, 'Доход');
  E.energy(s, -j.fatigue);
  E.stress(s, +3);
  toast('+'+fmt(j.pay)+' · энергия '+s.energy);
  closeModal(); save(S); renderAll();
}

/* ============================================================
   ОБУЧЕНИЕ
   ============================================================ */
function startCourse(id){
  const s = S;
  const cr = COURSES.find(x=>x.id===id);
  if (!cr) return;
  if (s.cash < cr.cost){ toast('Недостаточно средств'); return; }
  s.cash -= cr.cost;
  s.courses.push({...cr, weeksLeft: cr.weeks});
  s.tx.push({date:s.year*12+s.month, cat:'Обучение', reason:'Курс: '+cr.name, amount:-cr.cost});
  save(S); renderAll(); toast('Вы записаны на курс');
}

/* ============================================================
   РАБОТА
   ============================================================ */
function applyJob(careerId){
  const s = S;
  const cr = CAREERS.find(x=>x.id===careerId);
  if (!cr) return;
  const skillsOk = Object.entries(cr.req).every(([k,v])=>(s.skills[k]||0)>=v);
  if (!skillsOk){ toast('Недостаточно навыков'); return; }
  s.careerSearch = {vacancy:{...cr, salary: Math.round(cr.salary * DIFFICULTY[s.difficulty].incomeMul)}, waited:0};
  save(S); renderAll(); toast('Отклик отправлен');
}

function acceptOffer(){
  const s = S;
  if (!s.pendingJobOffer) return;
  s.job = s.pendingJobOffer; s.jobTenure = 0;
  s.pendingJobOffer = null;
  save(S); renderAll(); toast('Новая работа: '+s.job.name);
}

function declineOffer(){
  const s = S; s.pendingJobOffer = null; save(S); renderAll();
}

/* ============================================================
   ЖИЗНЬ: отдых и встречи
   ============================================================ */
function lifeRest(){
  const s = S;
  E.energy(s, +20); E.stress(s, -10);
  save(S); renderAll(); toast('Отдых дома');
}
function lifeFriends(){
  const s = S;
  const cost = tng(12000);
  if (s.cash < cost){ toast('Недостаточно средств'); return; }
  s.cash -= cost;
  s.tx.push({date:s.year*12+s.month, cat:'Развлечения', reason:'Встреча с друзьями', amount:-cost});
  E.social(s, +10); E.stress(s, -5);
  save(S); renderAll(); toast('Встреча с друзьями');
}

/* ============================================================
   ИМУЩЕСТВО: ремонт и авто
   ============================================================ */
function openRepair(){
  const s = S;
  const modal = el(`<div></div>`);
  modal.innerHTML = `
    <h2>Ремонт</h2>
    <div class="muted">Уровни отделки. Каждый повышает комфорт.</div>
    <div class="btn-row" style="flex-direction:column;margin-top:10px">
      <button onclick="doRepair(50000, 5)">Косметический ремонт (50 000 ₸) · +5 комфорта</button>
      <button onclick="doRepair(200000, 15)">Качественная отделка (200 000 ₸) · +15 комфорта</button>
      <button onclick="doRepair(500000, 25)">Полное обновление (500 000 ₸) · +25 комфорта</button>
      <button class="ghost" onclick="closeModal()">Закрыть</button>
    </div>
  `;
  openModal(modal);
}

function doRepair(cost, bonus){
  const s = S;
  const amt = tng(cost);
  if (s.cash < amt){ toast('Недостаточно средств'); return; }
  s.cash -= amt;
  s.comfort = clamp(s.comfort+bonus,0,100);
  s.realEstate[0].comfort = s.comfort;
  s.tx.push({date:s.year*12+s.month, cat:'Имущество', reason:'Ремонт', amount:-amt});
  closeModal(); save(S); renderAll(); toast('Ремонт выполнен');
}

function openCarBuy(){
  const s = S;
  const modal = el(`<div></div>`);
  const cars = [
    {name:'Старый бюджетный автомобиль', price:tng(2500000), maint:tng(40000)},
    {name:'Подержанный средний класс', price:tng(6000000), maint:tng(60000)},
    {name:'Новый автомобиль', price:tng(12000000), maint:tng(80000)},
    {name:'Премиальный автомобиль', price:tng(25000000), maint:tng(140000)},
  ];
  modal.innerHTML = `
    <h2>Покупка автомобиля</h2>
    <div class="muted">Доступно: ${fmt(s.cash)}</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      ${cars.map(c=>`<button onclick="doBuyCar('${c.name}', ${c.price}, ${c.maint})">${c.name} — ${fmt(c.price)} (содержание ${fmt(c.maint)}/мес)</button>`).join('')}
      <button class="ghost" onclick="closeModal()">Отмена</button>
    </div>
  `;
  openModal(modal);
}

function doBuyCar(name, price, maint){
  const s = S;
  if (s.cash < price){ toast('Недостаточно средств'); return; }
  s.cash -= price;
  s.car = {name, value:price, maintenance:maint};
  s.tx.push({date:s.year*12+s.month, cat:'Имущество', reason:'Покупка авто: '+name, amount:-price});
  closeModal(); save(S); renderAll(); toast('Автомобиль куплен');
}

/* ============================================================
   ВСПОМОГАТЕЛЬНЫЕ
   ============================================================ */
const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function monthName(m){ return MONTHS_RU[m-1] || ''; }
function skillName(k){ return {comm:'Коммуникация', anal:'Аналитика', digital:'Цифровые навыки', mgmt:'Управление', prof:'Проф. знания'}[k]||k; }
function catName(c){ return {Доход:'Доход', 'Бытовые':'Бытовые', 'Кредит':'Кредит', 'Транспорт':'Транспорт', 'Обучение':'Обучение', 'Имущество':'Имущество', 'Банк':'Банк', 'Накопления':'Накопления', 'Развлечения':'Развлечения', 'Прочее':'Прочее'}[c]||c; }
function escape(str){ return String(str).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

/* ============================================================
   ЭКСПОРТ В ГЛОБАЛЬНЫЙ SCOPE (для onclick в HTML)
   ============================================================ */
Object.assign(window, {
  go, closeModal, openActiveEvent, chooseEventOption,
  advanceDay, advanceWeek, openMonthClose, confirmMonth,
  openPrepay, doPrepay, openSchedule, openBank, doRefinance, openDeposit, doDeposit,
  openMoveToSavings, doMoveToSavings, openSubjobs, doSubjob,
  startCourse, applyJob, acceptOffer, declineOffer,
  lifeRest, lifeFriends, openRepair, doRepair, openCarBuy, doBuyCar,
  startNew, continueGame, giftChoice, afterIntro
});

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
(function init(){
  const existing = load();
  if (existing){ S = migrate(existing); }
  renderAll();
  // раз в 30 сек автосохранение
  setInterval(()=>{ if (S) save(S); }, 30000);
})();
</script>
