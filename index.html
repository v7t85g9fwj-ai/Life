<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Жизнь в рассрочку</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --ink:#1c2530; --muted:#6b7a8c;
    --green:#1f9d55; --green-bg:#e7f6ee; --red:#d64545; --red-bg:#fdeaea;
    --blue:#2f6fed; --blue-bg:#eaf1ff; --line:#e3e8ee; --shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.06);

  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:76px;position:relative}
  .screen{display:none;padding:14px 14px 24px;animation:fade .18s ease}
  .screen.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  h1,h2,h3{margin:0 0 8px}

  h2{font-size:17px}
  h3{font-size:15px}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .muted{color:var(--muted);font-size:13px}
  .big{font-size:26px;font-weight:700;letter-spacing:-.4px}
  .num{font-variant-numeric:tabular-nums}
  .green{color:var(--green)} .red{color:var(--red)} .blue{color:var(--blue)}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--blue-bg);color:var(--blue)}
  .pill.g{background:var(--green-bg);color:var(--green)} .pill.r{background:var(--red-bg);color:var(--red)}
  button{cursor:pointer;font-family:inherit;font-size:15px;border:none;border-radius:12px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:600;transition:transform .05s}
  button:active{transform:scale(.98)}
  button.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
  button.gray{background:#eef1f5;color:var(--ink)}
  button.green{background:var(--green)}
  button.red{background:var(--red)}

  .progress{height:10px;background:#eef1f5;border-radius:999px;overflow:hidden}
  .progress > i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s}
  .spark{width:100%;height:70px;display:block}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  input[type=number],select{font-family:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tabs .tab{padding:7px 12px;border-radius:999px;background:#eef1f5;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
  .tabs .tab.on{background:var(--ink);color:#fff}
  .list-item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:none}
  .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;z-index:10}
  .nav .item{flex:1;text-align:center;padding:9px 2px 10px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none}
  .nav .item .ico{font-size:19px;display:block;line-height:1.1}
  .nav .item.on{color:var(--blue);font-weight:700}
  .modal-wrap{position:fixed;inset:0;background:rgba(16,24,36,.45);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
  .modal-wrap.on{display:flex}
  .modal{background:#fff;max-width:520px;width:100%;border-radius:18px 18px 0 0;padding:18px 16px 20px;max-height:90vh;overflow:auto;animation:up .2s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .modal h2{margin-bottom:6px}
  .toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#1c2530;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;opacity:0;transition:opacity .25s;max-width:90%;text-align:center}
  .toast.on{opacity:1}
  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chip{background:#f2f5f9;border-radius:12px;padding:10px}
  .chip .v{font-size:18px;font-weight:700;margin-top:2px}
  .badge{font-size:11px;padding:2px 7px;border-radius:8px;background:#eef1f5;color:var(--muted)}
  .event-hero{background:linear-gradient(135deg,#eaf1ff,#f4f6f8);border-radius:14px;padding:14px;margin-bottom:10px}
  .monthly-row{display:flex;justify-content:space-between;padding:4px 0}
  .monthly-row .v{font-variant-numeric:tabular-nums}
  .divider{height:1px;background:var(--line);margin:8px 0}
  .goal{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .goal .top{display:flex;justify-content:space-between;font-size:13px}
  .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.mini{border-collapse:collapse;width:100%;font-size:12px}
  table.mini td,table.mini th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  table.mini th:first-child,table.mini td:first-child{text-align:left}
  .center{text-align:center}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .status-bar{position:sticky;top:0;z-index:9;background:rgba(244,246,248,.95);backdrop-filter:blur(8px);padding:8px 14px 10px;border-bottom:1px solid var(--line);margin:-14px -14px 10px}

  .mini-stat{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;font-size:10px;color:var(--muted)}
  .mini-stat .v{font-size:12px;font-weight:700;color:var(--ink)}
  .mini-bar{height:4px;width:100%;background:#e3e8ee;border-radius:999px;overflow:hidden;margin-top:2px}
  .mini-bar > i{display:block;height:100%;border-radius:999px}
  .subjob-disabled{opacity:.5}
</style>
</head>

<script>
"use strict";
/* ============================================================
   ДЕНЬГИ: всё в тиынах (1 ₸ = 100 тн)
   ============================================================ */
const T = 100;
const tng = v => Math.round(v * T);
const fmt = v => (v / T).toLocaleString('ru-RU', {maximumFractionDigits:0}) + ' ₸';
const fmt0 = v => Math.round(v / T).toLocaleString('ru-RU');
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const rnd = (a,b)=>a+Math.random()*(b-a);
const rndInt = (a,b)=>Math.floor(rnd(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => arr.map(v=>[v,Math.random()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
const uid = () => Math.random().toString(36).slice(2,10);

/* ============================================================
   ФИНАНСОВЫЙ ДВИЖОК
   ============================================================ */
const Fin = {
  annuity(P, yearlyPct, months){
    if (months <= 0) return 0;
    const r = yearlyPct/100/12;
    if (r === 0) return Math.round(P / months);
    const k = Math.pow(1+r, months);
    return Math.round(P * r * k / (k - 1));
  },
  monthInterest(P, yearlyPct){ return Math.round(P * (yearlyPct/100/12)); },
  applyPayment(balance, yearlyPct, payment){
    const interest = Math.min(this.monthInterest(balance, yearlyPct), payment);
    let principal = payment - interest;
    if (principal > balance){ principal = balance; }
    const paid = interest + principal;
    return { interest, principal, paid, newBalance: balance - principal };
  },
  prepay(loan, extra, strategy){
    extra = Math.min(extra, loan.balance);
    if (extra <= 0) return loan;
    const nb = loan.balance - extra;
    if (nb === 0){
      return {...loan, balance:0, monthsLeft:0, monthly:0, totalExtra: (loan.totalExtra||0)+extra};
    }
    if (strategy === 'term'){
      const r = loan.rate/100/12;
      let months = loan.monthsLeft;
      if (loan.monthly > this.monthInterest(nb, loan.rate)){
        months = Math.ceil(Math.log(loan.monthly/(loan.monthly - nb*r))/Math.log(1+r));
        if (!isFinite(months) || months <= 0) months = loan.monthsLeft;
        months = Math.min(months, loan.monthsLeft);
      }
      return {...loan, balance: nb, monthsLeft: months, totalExtra:(loan.totalExtra||0)+extra};
    } else {
      const monthly = this.annuity(nb, loan.rate, loan.monthsLeft);
      return {...loan, balance: nb, monthly, totalExtra:(loan.totalExtra||0)+extra};
    }
  },
  totalInterestForecast(balance, yearlyPct, monthsLeft, monthly){
    if (balance <= 0 || monthsLeft <= 0) return 0;
    let bal = balance, interest = 0, guard = 0;
    while (bal > 0 && guard++ < 2000){
      const i = Math.min(this.monthInterest(bal, yearlyPct), monthly);
      const p = Math.min(bal, monthly - i);
      interest += i;
      bal -= p;
      if (p <= 0) break;
    }
    return interest;
  }
};

/* ============================================================

const FIRST_NAMES_M = ['Асет','Серик','Данияр','Ержан','Нурлан','Алишер','Тимур','Арман','Даулет','Руслан','Максим','Алексей','Дмитрий','Иван','Азамат','Ерлан','Бекзат','Санжар','Мирас','Адиль'];

const LAST_NAMES = ['Ахметов','Сериков','Данияров','Ержанов','Нурланов','Алишеров','Тимуров','Арманов','Даулетов','Русланов','Смирнов','Иванов','Кузнецов','Петров','Азаматов','Ерланов','Бекзатов','Санжаров','Мирасов','Адилев'];

function randName(gender){
  const fn = gender==='f'? pick(FIRST_NAMES_F) : pick(FIRST_NAMES_M);
  return fn + ' ' + pick(LAST_NAMES);
}

/* ============================================================
   СОБЫТИЯ (полная коллекция)
   ============================================================ */

const E = {
  money(s, delta, reason, cat='Прочее'){
    s.cash += delta;
    s.tx.push({date:s.year*12+s.month, cat, reason, amount:delta});
    if (s.cash < 0) s.flags.overdraft = true;
  },
  energy(s, d){ s.energy = clamp(s.energy+d, 0, 100); },
  stress(s, d){ s.stress = clamp(s.stress+d, 0, 100); },
  social(s, d){ s.social = clamp(s.social+d, 0, 100); },
  comfort(s, d){ s.comfort = clamp(s.comfort+d, 0, 100); },
  takeCredit(s, amount, ratePct, months, name){
    const monthly = Fin.annuity(amount, ratePct, months);
    s.credits.push({id:uid(), name, balance:amount, rate:ratePct, monthsLeft:months, monthly, initialMonths:months, initialAmount:amount, totalExtra:0});
    E.money(s, amount, 'Получен кредит: '+name, 'Кредит');
  },
  payCreditMonthly(s, cr){
    if (cr.balance <= 0) return;
    const payment = Math.min(cr.monthly, cr.balance + Fin.monthInterest(cr.balance, cr.rate));
    const res = Fin.applyPayment(cr.balance, cr.rate, payment);
    cr.balance = res.newBalance;
    cr.monthsLeft = Math.max(0, cr.monthsLeft-1);
    E.money(s, -payment, 'Платёж: '+cr.name, 'Кредит');
    if (cr.balance <= 0){ cr.closed = true; toast('Кредит закрыт: '+cr.name); }
  }
};

function newState(scenarioId, difficultyId, maritalStatus){
  const sc = SCENARIOS[scenarioId];
  const diff = DIFFICULTY[difficultyId];
  const loan = sc.price - sc.down;
  const monthly = Fin.annuity(loan, sc.rate, sc.years*12);
  let spouse = null;
  if (maritalStatus === 'married'){
    const gender = Math.random()<.5?'f':'m';
    spouse = {
      name: randName(gender),
      gender,
      salary: tng(rndInt(280000, 550000)) * diff.incomeMul,
    };
  }
  return {
    v:2,
    scenario:scenarioId, difficulty:difficultyId,
    year:2025, month:1, day:1,
    cash: sc.savings,
    savings: 0, deposit: 0,
    energy:80, stress:30, social:60, comfort:40,
    skills:{comm:1, anal:1, digital:1, mgmt:0, prof:1},
    job: {...CAREERS[0], salary: Math.round(sc.startSalary*diff.incomeMul)},
    jobTenure: 0,
    careerSearch: null,
    courses: [],
    credits:[{id:'mortgage', name:'Ипотека', balance:loan, rate:sc.rate, monthsLeft:sc.years*12, monthly, initialMonths:sc.years*12, initialAmount:loan, totalExtra:0}],
    realEstate:[{id:'apt', name:'Квартира', value:sc.price, comfort:40, rented:false}],
    car: null,
    spouse,
    children: [],
    pets: 0,
    spouseHealth: 100,
    monthlyChildCost: 0,
    tx:[],
    eventsHistory:[],
    activeEvent:null,
    monthClosed:false,
    flags:{},
    totalInterestPaid:0,
    inflation: 0.006,
    livingCostBase: Math.round(sc.living * diff.expenseMul),
    marketSalaryIndex: 1.0,        // растёт с опытом — привязка вакансий
    subjobsUsed: {},               // {subjobId: countThisMonth}
    jobsBoard: [],                 // актуальные вакансии
    goals:[
      {id:'emergency', name:'Подушка на 3 месяца', target:null, current:0},

  };
}

   МЕСЯЧНЫЙ ЦИКЛ
   ============================================================ */
function startNextMonth(s){
  s.monthClosed = false;
  s.month += 1;
  if (s.month > 12){ s.month = 1; s.year += 1; }
  s.day = 1;
  s.energy = clamp(s.energy+20, 0, 100);
  s.stress = clamp(s.stress-6, 0, 100);
  s.social = clamp(s.social-2, 0, 100);
  s.jobTenure = (s.jobTenure||0) + 1;
  s.livingCostBase = Math.round(s.livingCostBase * (1 + s.inflation));
  s.subjobsUsed = {};
  s.marketSalaryIndex = Math.min(2.5, s.marketSalaryIndex * 1.005);

  // курсы
  s.courses = s.courses.map(c => ({...c, weeksLeft: c.weeksLeft-4}));
  s.courses.forEach(c=>{
    if (c.weeksLeft<=0){
      Object.entries(c.effect).forEach(([k,v])=>{ s.skills[k]=(s.skills[k]||0)+v; });
      toast('Курс завершён: '+c.name);
    }
  });
  s.courses = s.courses.filter(c=>c.weeksLeft>0);

  // поиск работы
  if (s.careerSearch){
    s.careerSearch.waited = (s.careerSearch.waited||0)+1;
    if (s.careerSearch.waited >= 2){
      const chance = 0.55 + 0.05*Object.values(s.skills).reduce((a,b)=>a+b,0);
      if (Math.random() < chance){
        toast('Оффер: '+s.careerSearch.vacancy.name);
        s.pendingJobOffer = s.careerSearch.vacancy;
      } else toast('Отказ по вакансии');
      s.careerSearch = null;
    }
  }

  // доход
  if (s.job){
    s.cash += s.job.salary;
    s.tx.push({date:s.year*12+s.month, cat:'Доход', reason:'Зарплата', amount:s.job.salary});
  }
  if (s.spouse){
    s.cash += s.spouse.salary;
    s.tx.push({date:s.year*12+s.month, cat:'Доход', reason:'Зарплата супруга', amount:s.spouse.salary});
  }

  // расходы
  const expenses = computeMonthlyExpenses(s);
  Object.values(expenses).forEach(e=>{
    if (e.amount > 0){
      s.cash -= e.amount;
      s.tx.push({date:s.year*12+s.month, cat:e.cat, reason:e.reason, amount:-e.amount});
    }
  });

  // проценты по депозиту
  if (s.deposit > 0){
    const interest = Math.round(s.deposit * 0.14 / 12);
    s.deposit += interest;
    s.tx.push({date:s.year*12+s.month, cat:'Банк', reason:'Проценты по депозиту', amount:interest});
  }
  if (s.savings > 0){
    const interest = Math.round(s.savings * 0.12 / 12);
    s.savings += interest;
  }

  // кредиты
  s.credits.forEach(cr=>E.payCreditMonthly(s, cr));
  s.credits = s.credits.filter(c=>c.balance>0);

  if (s.cash < 0){ s.flags.overdraft = true; s.stress = clamp(s.stress+10,0,100); }

  // годовая индексация зарплат
  if (s.month === 1 && s.job){
    const idx = rnd(1.05, 1.10);
    s.job = {...s.job, salary: Math.round(s.job.salary*idx)};
    s.tx.push({date:s.year*12+s.month, cat:'Доход', reason:'Индексация зарплаты', amount:0});
  }

  // обновить вакансии
  refreshJobsBoard(s);

  // случайное событие
  rollEvent(s);

  save(s);
}

function computeMonthlyExpenses(s){
  const base = s.livingCostBase;
  const childCost = (s.monthlyChildCost || 0);
  return {
    food:      {cat:'Бытовые', reason:'Продукты',  amount: Math.round(base*0.42) + Math.round(childCost*0.3)},
    utilities: {cat:'Бытовые', reason:'Коммунальные', amount: Math.round(base*0.22) + Math.round(childCost*0.15)},
    transport: {cat:'Бытовые', reason:'Транспорт', amount: Math.round(base*0.16)},
    internet:  {cat:'Бытовые', reason:'Связь и интернет', amount: Math.round(base*0.08)},
    misc:      {cat:'Бытовые', reason:'Прочие расходы', amount: Math.round(base*0.12)},
    children:  childCost ? {cat:'Семья', reason:'Расходы на детей', amount: childCost} : {amount:0},
    car:       s.car ? {cat:'Транспорт', reason:'Содержание авто', amount: Math.round(s.car.maintenance)} : {amount:0},
  };
}

/* ============================================================
   ВАКАНСИИ (динамические, привязаны к рыночной ставке)
   ============================================================ */
function refreshJobsBoard(s){
  // Базовая зарплата кандидата: текущая или стартовая
  const baseSalary = s.job ? s.job.salary : tng(450000);
  const marketMin = Math.round(baseSalary * 0.85 * s.marketSalaryIndex);
  const marketMax = Math.round(baseSalary * 1.35 * s.marketSalaryIndex);
  const list = [];
  const careersSample = shuffle(CAREERS).slice(0, 6);
  careersSample.forEach(cr=>{
    const salary = rndInt(marketMin, marketMax);
    list.push({
      id: uid(),
      careerId: cr.id,
      name: cr.name,
      salary,
      req: cr.req,
      risk: cr.risk,
    });
  });
  s.jobsBoard = list;
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
function rollEvent(s){
  if (Math.random() > 0.80 * DIFFICULTY[s.difficulty].eventRisk){ s.activeEvent = null; return; }
  const candidates = [];
  EVENT_TEMPLATES.forEach(t=>{
    if (t.cond && !t.cond(s)) return;
    const recent = s.eventsHistory.filter(e=>e.id===t.id && (s.year*12+s.month)-e.month < 4).length;
    if (recent >= 1) return;
    candidates.push(t);
  });
  if (!candidates.length){ s.activeEvent = null; return; }
  const totalW = candidates.reduce((a,c)=>a+(c.w||1),0);
  let r = Math.random()*totalW;
  let chosen = candidates[0];
  for (const c of candidates){ r -= (c.w||1); if (r <= 0){ chosen = c; break; } }
  s.activeEvent = {id:chosen.id, data: chosen.build(s)};
  s.eventsHistory.push({id:chosen.id, month: s.year*12+s.month});
}

function drawDebtSpark(root){
  const svg = root.querySelector('[data-spark="debt"]'); if (!svg) return;
  const mort = S.credits.find(c=>c.id==='mortgage'); if (!mort) return;
  const points = [];
  let bal = mort.balance; const monthly = mort.monthly;
  for (let i=0;i<30;i++){
    const r = Fin.monthInterest(bal, mort.rate);
    const p = Math.min(bal, monthly-r);
    bal -= p; points.push(bal);
    if (bal <= 0) break;
  }
  const max = Math.max(...points, 1);
  const W = 300, H = 70;
  const stepX = W / Math.max(points.length-1,1);
  const path = points.map((v,i)=>`${i===0?'M':'L'} ${(i*stepX).toFixed(1)} ${(H - v/max*H + 1).toFixed(1)}`).join(' ');
  svg.innerHTML = `<path d="${path}" stroke="#2f6fed" stroke-width="2" fill="none"/>`;
}

function giftChoice(kind){
  const s = S;
  const mort = s.credits[0];
  if (kind === 'prepay'){
    const extra = Math.min(tng(200000), mort.balance);
    s.cash -= extra;
    s.credits[0] = Fin.prepay(mort, extra, 'term');
    s.tx.push({date:s.year*12+s.month, cat:'Кредит', reason:'Досрочное погашение', amount:-extra});
    toast('Досрочно погашено '+fmt(extra));
  } else if (kind === 'repair'){
    if (s.cash >= tng(80000)){
      s.cash -= tng(80000);

function openPrepay(){
  const s = S;
  const mort = s.credits.find(c=>c.id==='mortgage'); if (!mort) return;
  const maxExtra = Math.min(s.cash, mort.balance);
  const beforeInterest = Fin.totalInterestForecast(mort.balance, mort.rate, mort.monthsLeft, mort.monthly);
  const modal = el(`<div></div>`);
  modal.innerHTML = `
    <h2>Досрочное погашение</h2>
    <div class="muted">Доступно: ${fmt(s.cash)}. Остаток: ${fmt(mort.balance)}.</div>
    <div class="field" style="margin-top:10px">
      <label class="muted">Сумма (₸)</label>
      <input type="number" id="prepaySum" value="${Math.round(maxExtra/T)}" min="0" max="${Math.round(mort.balance/T)}"/>
    </div>
    <div class="field">
      <label class="muted">Стратегия</label>
      <select id="prepayStrategy">
        <option value="term">Сократить срок</option>
        <option value="payment">Уменьшить платёж</option>
      </select>
    </div>
    <div id="prepayPreview" class="card" style="box-shadow:none;background:#f7f9fb"></div>
    <div class="btn-row" style="margin-top:10px">
      <button class="green" onclick="doPrepay()">Внести</button>
      <button class="ghost" onclick="closeModal()">Отмена</button>
    </div>
  `;
  openModal(modal);
  const input = modal.querySelector('#prepaySum');
  const sel = modal.querySelector('#prepayStrategy');
  const preview = modal.querySelector('#prepayPreview');
  function update(){
    const amt = Math.max(0, Math.min(mort.balance, tng(Number(input.value)||0)));
    const after = Fin.prepay({...mort}, amt, sel.value);
    const newInt = Fin.totalInterestForecast(after.balance, after.rate, after.monthsLeft, after.monthly);
    preview.innerHTML = `
      <div class="kv"><span>Сумма</span><span class="num">${fmt(amt)}</span></div>
      <div class="kv"><span>Платёж</span><span class="num">${fmt(mort.monthly)} → ${fmt(after.monthly)}</span></div>
      <div class="kv"><span>Срок</span><span class="num">${mort.monthsLeft} → ${after.monthsLeft} мес.</span></div>
      <div class="kv"><span>Проценты</span><span class="num">${fmt(beforeInterest)} → ${fmt(newInt)}</span></div>
      <div class="kv"><span>Экономия</span><span class="num green">${fmt(beforeInterest-newInt)}</span></div>
    `;
  }
  input.oninput = update; sel.onchange = update; update();
}

function doPrepay(){
  const s = S;
  const mort = s.credits.find(c=>c.id==='mortgage'); if (!mort) return;
  const input = document.getElementById('prepaySum');
  const sel = document.getElementById('prepayStrategy');
  const amt = Math.max(0, Math.min(mort.balance, tng(Number(input.value)||0)));
  if (amt <= 0){ toast('Некорректная сумма'); return; }
  if (amt > s.cash){ toast('Недостаточно средств'); return; }
  s.cash -= amt;
  s.credits[s.credits.indexOf(mort)] = Fin.prepay(mort, amt, sel.value);
  s.tx.push({date:s.year*12+s.month, cat:'Кредит', reason:'Досрочка', amount:-amt});
  closeModal(); save(S); renderAll(); toast('Досрочка выполнена');
}

function openSchedule(){
  const s = S;
  const mort = s.credits.find(c=>c.id==='mortgage'); if (!mort) return;
  let bal = mort.balance; let rows = []; let totalInt = 0; let i = 0;
  while (bal > 0 && i < mort.monthsLeft+1){
    const interest = Fin.monthInterest(bal, mort.rate);
    const principal = Math.min(bal, mort.monthly - interest);
    bal -= principal; totalInt += interest;
    rows.push({i:i+1, interest, principal, bal});
    i++;
    if (principal <= 0) break;
  }
  const modal = el(`<div></div>`);
  modal.innerHTML = `
    <h2>График</h2>
    <div class="muted">Переплата: ${fmt(totalInt)}</div>
    <div style="max-height:300px;overflow:auto;margin-top:8px">
      <table class="mini">
        <tr><th>№</th><th>Проценты</th><th>Долг</th><th>Остаток</th></tr>
        ${rows.slice(0,60).map(r=>`<tr><td>${r.i}</td><td>${fmt0(r.interest)}</td><td>${fmt0(r.principal)}</td><td>${fmt0(r.bal)}</td></tr>`).join('')}
      </table>
    </div>
    <button class="ghost" style="width:100%;margin-top:10px" onclick="closeModal()">Закрыть</button>
  `;
  openModal(modal);
}

function openSubjobs(){
  const s = S;
  const modal = el(`<div></div>`);
  const available = SUBJOBS.filter(j=>{
    if (j.req.car && !s.car) return false;
    return Object.entries(j.req).every(([k,v])=>k==='car'?true:(s.skills[k]||0)>=v);
  });
  modal.innerHTML = `
    <h2>Подработки</h2>
    <div class="muted">Энергия: ${s.energy}/100</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      ${available.map(j=>{
        const used = s.subjobsUsed[j.id]||0;
        const limit = j.limit||1;
        const can = used < limit && s.energy >= 10;
        const payRange = Array.isArray(j.pay) ? `${fmt(j.pay[0])}–${fmt(j.pay[1])}` : fmt(j.pay);
        return `<button ${!can?'class="gray" disabled':`onclick="doSubjob('${j.id}')"`}>
          ${escape(j.name)} — ${payRange} · ${used}/${limit}
        </button>`;
      }).join('')}
    </div>
    <button class="ghost" style="width:100%;margin-top:12px" onclick="closeModal()">Закрыть</button>
  `;
  openModal(modal);
}

function doSubjob(id){
  const s = S;
  const j = SUBJOBS.find(x=>x.id===id); if (!j) return;
  if (s.energy < 10){ toast('Слишком устали'); return; }
  const used = s.subjobsUsed[j.id]||0;
  if (used >= (j.limit||1)){ toast('Лимит на этот месяц'); return; }
  if (j.req.car && !s.car){ toast('Нужно авто'); return; }
  let pay;
  if (j.id === 'taxi'){
    // день недели влияет на доход
    const day = s.day;
    const mul = day===5||day===6 ? rnd(1.2, 1.5) : day===0 ? rnd(0.8, 1.0) : rnd(0.9, 1.2);
    pay = Math.round(rnd(j.pay[0], j.pay[1]) * mul);
  } else {
    pay = rndInt(j.pay[0], j.pay[1]);
  }
  E.money(s, pay, 'Подработка: '+j.name, 'Доход');
  E.energy(s, -j.fatigue);
  E.stress(s, +2);
  s.subjobsUsed[j.id] = used + 1;
  toast('+'+fmt(pay)+' · энергия '+s.energy);
  closeModal(); save(S); renderAll();
}

function doBuyCar(name, price, maint, credit){
  const s = S;
  if (credit){
    const down = Math.round(price*0.2);
    if (s.cash < down){ toast('Нужно '+fmt(down)+' на взнос'); return; }
    const loan = price - down;
    const monthly = Fin.annuity(loan, 15, 36);
    s.cash -= down;
    const creditId = uid();
    s.credits.push({id:creditId, name:'Автокредит: '+name, balance:loan, rate:15, monthsLeft:36, monthly, initialMonths:36, initialAmount:loan, totalExtra:0});
    s.car = {name, value:price, maintenance:maint, creditId};
    s.tx.push({date:s.year*12+s.month, cat:'Имущество', reason:'Взнос за авто', amount:-down});
    toast('Авто куплено в кредит');
  } else {
    if (s.cash < price){ toast('Недостаточно средств'); return; }
    s.cash -= price;
    s.car = {name, value:price, maintenance:maint};
    s.tx.push({date:s.year*12+s.month, cat:'Имущество', reason:'Покупка авто', amount:-price});
    toast('Авто куплено');
  }
  closeModal(); save(S); renderAll();
}
